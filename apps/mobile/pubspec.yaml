name: drugshield_mobile
description: "DrugShield — Digital Companion for Field Drug Testing (SIH26231)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation & State ──
  go_router: ^14.6.0
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # ── Camera & Media ──
  camera: ^0.11.0
  image: ^4.3.0

  # ── On-Device ML Inference ──
  tflite_flutter: ^0.11.0

  # ── Local Encrypted Storage ──
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  sqlcipher_flutter_libs: ^0.6.0

  # ── Security & Crypto ──
  local_auth: ^2.3.0
  pointycastle: ^3.9.0
  crypto: ^3.0.5

  # ── Networking & Serialization ──
  grpc: ^4.0.0
  protobuf: ^3.1.0
  connectivity_plus: ^6.1.0

  # ── UI Utilities ──
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  signature_pad_flutter: ^5.0.0

  # ── Location ──
  geolocator: ^13.0.0

  # ── Permissions ──
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  riverpod_generator: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
