##############################################################################
# DrugShield — Fabric Channel Configuration (configtx.yaml)
# SIH26231: Digital Companion for Field Drug Testing
##############################################################################

---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/drugshield.gov.in/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &NcbOrg
    Name: NcbOrg
    ID: NcbMSP
    MSPDir: crypto-config/peerOrganizations/ncb.gov.in/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('NcbMSP.admin', 'NcbMSP.peer', 'NcbMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('NcbMSP.admin', 'NcbMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('NcbMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('NcbMSP.peer')"
    AnchorPeers:
      - Host: peer0.ncb.gov.in
        Port: 7051

  - &PoliceOrg
    Name: PoliceOrg
    ID: PoliceMSP
    MSPDir: crypto-config/peerOrganizations/police.gov.in/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PoliceMSP.admin', 'PoliceMSP.peer', 'PoliceMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PoliceMSP.admin', 'PoliceMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PoliceMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PoliceMSP.peer')"
    AnchorPeers:
      - Host: peer0.police.gov.in
        Port: 8051

  - &CfslOrg
    Name: CfslOrg
    ID: CfslMSP
    MSPDir: crypto-config/peerOrganizations/cfsl.gov.in/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CfslMSP.admin', 'CfslMSP.peer', 'CfslMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CfslMSP.admin', 'CfslMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CfslMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CfslMSP.peer')"
    AnchorPeers:
      - Host: peer0.cfsl.gov.in
        Port: 9051

  - &JudiciaryOrg
    Name: JudiciaryOrg
    ID: JudiciaryMSP
    MSPDir: crypto-config/peerOrganizations/judiciary.gov.in/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('JudiciaryMSP.admin', 'JudiciaryMSP.peer', 'JudiciaryMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('JudiciaryMSP.admin', 'JudiciaryMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('JudiciaryMSP.admin')"
    AnchorPeers:
      - Host: peer0.judiciary.gov.in
        Port: 10051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Read:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Write:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admin:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.drugshield.gov.in:7050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  EtcdRaft:
    Consenters:
      - Host: orderer.drugshield.gov.in
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/drugshield.gov.in/orderers/orderer.drugshield.gov.in/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/drugshield.gov.in/orderers/orderer.drugshield.gov.in/tls/server.crt
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admin:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Read:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Write:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admin:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  SeizuresChannel:
    Consortium: DrugShieldConsortium
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *NcbOrg
        - *PoliceOrg
        - *CfslOrg
        - *JudiciaryOrg
